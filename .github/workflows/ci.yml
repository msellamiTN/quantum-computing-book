name: Validate book examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  chapter-01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r labs/chapter-01/requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run standalone example
        run: python scripts/chapter_01_superposition.py
